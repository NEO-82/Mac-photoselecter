name: Build macOS installer

on:
  push:
    branches: [codex/macos-installer-download]
    paths-ignore: ['downloads/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 0.1.0)'
        required: true
        default: '0.5.2'
        type: string

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  PHOTOSELECT_VERSION: ${{ inputs.version || '0.5.2' }}
  PHOTOSELECT_BUILD_NUMBER: ${{ github.run_number }}
  PHOTOSELECT_UI_SNAPSHOT_PATH: .build/browser-layout.png

jobs:
  package:
    # Use the Intel macOS pool when arm64 hosted runner capacity is unavailable.
    # package-macos.sh still builds and verifies an arm64-only application.
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch checksum-pinned Sony ARW regression samples
        run: |
          export PHOTOSELECT_ARW_SAMPLE_DIRECTORY="$RUNNER_TEMP/photoselect-raw-samples"
          printf 'PHOTOSELECT_ARW_SAMPLE_DIRECTORY=%s\n' "$PHOTOSELECT_ARW_SAMPLE_DIRECTORY" >> "$GITHUB_ENV"
          bash scripts/fetch-raw-test-samples.sh
      - name: Test, build arm64 app and verify DMG
        id: package
        run: |
          set -o pipefail
          bash scripts/package-macos.sh 2>&1 | tee "$RUNNER_TEMP/PhotoSelect-build.log"
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          root = ET.parse('.build/xctest-results.xml').getroot()
          cases = list(root.iter('testcase'))
          assert cases, 'No macOS XCTest cases executed'
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          required = {
              'testMixedBrowserFolderNavigationFilePreviewAndCreditLayout',
              'testSelectingThumbnailChangesRightPreview',
          }
          names = {case.get('name', '').removesuffix('()') for case in cases}
          assert required <= names, f'Missing UI checks: {required - names}'
          print(f'Verified {len(cases)} macOS XCTest cases, including mixed browser UI, without failures or skips')
          PYTEST
          for evidence in .build/arw-*.json; do
            if [[ -f "$evidence" ]]; then cp "$evidence" "${evidence%.json}-debug.json"; fi
          done
          xcrun swift test --configuration release --jobs 2 --parallel --num-workers 1 \
            --filter 'ImagePipelineTests.testRealSony|BrowserUITests.testRealA7M4' \
            --xunit-output .build/release-preview-results.xml 2>&1 | tee -a "$RUNNER_TEMP/PhotoSelect-build.log"
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          root = ET.parse('.build/release-preview-results.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 3, f'Expected 3 optimized RAW checks, got {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          print('Verified 3 Release RAW preview checks executed without failures or skips')
          PYTEST
          icon_mount="$RUNNER_TEMP/photoselect-icon-mount"
          mkdir -p "$icon_mount"
          trap 'hdiutil detach "$icon_mount"' EXIT
          icon_artifact="PhotoSelect-${PHOTOSELECT_VERSION}-${PHOTOSELECT_BUILD_NUMBER}-arm64"
          hdiutil attach -readonly -nobrowse -mountpoint "$icon_mount" "dist/$icon_artifact/$icon_artifact.dmg"
          xcrun swift scripts/verify-app-icon.swift Resources/AppIcon.png "$icon_mount/정광이의 MAC 포토셀렉터.app" .build
          hdiutil detach "$icon_mount"
          trap - EXIT
      - name: Upload personal-test installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSelect-${{ env.PHOTOSELECT_VERSION }}-arm64
          path: |
            dist/PhotoSelect-*/PhotoSelect-*.dmg
            dist/PhotoSelect-*/SHA256SUMS
            ${{ runner.temp }}/PhotoSelect-build.log
            .build/browser-layout.png
            .build/browser-dark.png
            .build/browser-light.png
            .build/browser-mixed*.png
            .build/browser-document.png
            .build/*results.xml
            .build/about-panel.png
            .build/arw-*.json
            .build/icon-validation.json
            .build/finder-icon.png
          if-no-files-found: error
          retention-days: 14
      - name: Save installer and build evidence on the delivery branch
        if: always() && github.ref_name == 'codex/macos-installer-download'
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: bash scripts/publish-installer-result.sh
