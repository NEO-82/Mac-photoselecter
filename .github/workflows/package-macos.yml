name: Build macOS installer

on:
  push:
    branches: [codex/macos-installer-download]
    paths-ignore: ['downloads/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 0.1.0)'
        required: true
        default: '0.5.0'
        type: string

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  PHOTOSELECT_VERSION: ${{ inputs.version || '0.5.0' }}
  PHOTOSELECT_BUILD_NUMBER: ${{ github.run_number }}
  PHOTOSELECT_UI_SNAPSHOT_PATH: .build/browser-layout.png

jobs:
  package:
    # Use the Intel macOS pool when arm64 hosted runner capacity is unavailable.
    # package-macos.sh still builds and verifies an arm64-only application.
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch checksum-pinned Sony ARW regression samples
        run: |
          export PHOTOSELECT_ARW_SAMPLE_DIRECTORY="$RUNNER_TEMP/photoselect-raw-samples"
          printf 'PHOTOSELECT_ARW_SAMPLE_DIRECTORY=%s\n' "$PHOTOSELECT_ARW_SAMPLE_DIRECTORY" >> "$GITHUB_ENV"
          bash scripts/fetch-raw-test-samples.sh
      - name: Test, build arm64 app and verify DMG
        id: package
        run: |
          set -o pipefail
          bash scripts/package-macos.sh 2>&1 | tee "$RUNNER_TEMP/PhotoSelect-build.log"
      - name: Upload personal-test installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSelect-${{ env.PHOTOSELECT_VERSION }}-arm64
          path: |
            dist/PhotoSelect-*/PhotoSelect-*.dmg
            dist/PhotoSelect-*/SHA256SUMS
            ${{ runner.temp }}/PhotoSelect-build.log
            .build/browser-layout.png
            .build/browser-dark.png
            .build/browser-light.png
            .build/about-panel.png
            .build/arw-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Save installer and build evidence on the delivery branch
        if: always() && github.ref_name == 'codex/macos-installer-download'
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: bash scripts/publish-installer-result.sh
