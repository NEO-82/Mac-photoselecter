name: Build macOS installer

on:
  push:
    branches: [codex/macos-installer-download, codex/macos27-compatibility, codex/exfat-finder-compatibility]
    paths-ignore: ['downloads/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 0.1.0)'
        required: true
        default: '0.7.7'
        type: string
      runner:
        description: 'macOS runner (auto uses the previously verified xcode-27 Apple Silicon image)'
        required: false
        default: auto
        type: choice
        options: [auto, macos-15, macos-15-intel, xcode-27]

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  PHOTOSELECT_VERSION: ${{ inputs.version || '0.7.7' }}
  PHOTOSELECT_BUILD_NUMBER: ${{ github.run_number }}
  PHOTOSELECT_UI_SNAPSHOT_PATH: .build/browser-layout.png

jobs:
  package:
    # Match the previously verified macOS 27 Apple Silicon path.
    # Hosted macOS 15 Intel/ARM acquisition failed before builds 103/104 ran.
    # Both macOS 15 targets remain available through the manual runner input.
    runs-on: ${{ inputs.runner != '' && inputs.runner != 'auto' && inputs.runner || 'xcode-27' }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch checksum-pinned Sony ARW regression samples
        run: |
          export PHOTOSELECT_ARW_SAMPLE_DIRECTORY="$RUNNER_TEMP/photoselect-raw-samples"
          printf 'PHOTOSELECT_ARW_SAMPLE_DIRECTORY=%s\n' "$PHOTOSELECT_ARW_SAMPLE_DIRECTORY" >> "$GITHUB_ENV"
          bash scripts/fetch-raw-test-samples.sh
      - name: Test, build arm64 app and verify DMG
        id: package
        run: |
          set -o pipefail
          {
            sw_vers; uname -m; xcodebuild -version; df -h .; sysctl -n hw.memsize
            if [[ "$(uname -m)" == arm64 ]]; then
              xcrun swift scripts/prepare-ci-display.swift
              xcrun swift -e 'import AppKit; let size = NSScreen.main!.visibleFrame.size; print("Independent worker visible area: \(size)"); precondition(size.width >= 1200 && size.height >= 792)'
            fi
            xcrun swift test --jobs 2 --parallel --num-workers 1 --filter 'FileTransferUITests|BrowserUITests.testTagBadgeReturnsAfterClosingAndRecreatingBrowser' \
              --xunit-output .build/file-transfer-ui-results.xml
            python3 - <<'PYTRANSFER'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('.build/file-transfer-ui-results.xml').getroot().iter('testcase'))
          assert len(cases) == 3, len(cases)
          assert not any(c.find(t) is not None for c in cases for t in ('failure', 'error', 'skipped'))
          PYTRANSFER
            bash scripts/probe-rename-filesystems.sh
            bash scripts/package-macos.sh
          } 2>&1 | tee "$RUNNER_TEMP/PhotoSelect-build.log"
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          root = ET.parse('.build/xctest-results.xml').getroot()
          cases = list(root.iter('testcase'))
          assert cases, 'No macOS XCTest cases executed'
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          required = {
              'testMixedBrowserFolderNavigationFilePreviewAndCreditLayout',
              'testSelectingThumbnailChangesRightPreview',
              'testClickZoomAllPercentagesAcrossDisplayScales',
              'testClickZoomSessionResetsAtLaunchAndRejectsInvalidValues',
              'testHeldPlusMinusChangesZoomWithoutInterruptingInspection',
              'testVolume14RealSonyFilesRenameWithoutChangingBytesOrUnselectedFiles',
              'testVolumeContentIdentityRecovery',
              'testVolumeCompatibilityConsentCancelAndActualRename',
              'testContentJournalRejectsMiddleByteChangesAndAmbiguousAliases',
              'testResponderCopyIncludesSelectedFolderPhotoAndDocument',
              'testResponderPasteCopiesAndClearsStaleDestinationTagWhilePreservingOriginal',
              'testEverySavedZoomRendersAtSelectedSizeAndSurvivesDeleteAndNavigation',
              'testVolumeRenameCountsTimingAndModificationDates',
          }
          names = {case.get('name', '').removesuffix('()') for case in cases}
          assert required <= names, f'Missing UI checks: {required - names}'
          print(f'Verified {len(cases)} macOS XCTest cases, including mixed browser UI, without failures or skips')
          PYTEST
          for evidence in .build/arw-*.json; do
            if [[ -f "$evidence" ]]; then cp "$evidence" "${evidence%.json}-debug.json"; fi
          done
          xcrun swift test --configuration release --jobs 2 --parallel --num-workers 1 \
            --filter 'ImagePipelineTests.testRealSony|BrowserUITests.testRealA7M4' \
            --xunit-output .build/release-preview-results.xml 2>&1 | tee -a "$RUNNER_TEMP/PhotoSelect-build.log"
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          root = ET.parse('.build/release-preview-results.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 4, f'Expected 4 optimized RAW checks, got {len(cases)}'
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          print('Verified 4 Release RAW preview checks executed without failures or skips')
          PYTEST
          icon_mount="$RUNNER_TEMP/photoselect-icon-mount"
          mkdir -p "$icon_mount"
          trap 'hdiutil detach "$icon_mount"' EXIT
          icon_artifact="J-S-${PHOTOSELECT_VERSION}-${PHOTOSELECT_BUILD_NUMBER}-arm64"
          hdiutil attach -readonly -nobrowse -mountpoint "$icon_mount" "dist/$icon_artifact/$icon_artifact.dmg"
          xcrun swift scripts/verify-app-icon.swift Resources/AppIcon.png "$icon_mount/J♡S.app" .build
          hdiutil detach "$icon_mount"
          trap - EXIT
      - name: Measure Release selection performance on 3005 photos
        id: selection
        run: |
          set -o pipefail
          xcrun swift test --configuration release --jobs 2 --parallel --num-workers 1 \
            --filter 'BrowserUITests.testMultiSelectionThreeThousand' \
            --xunit-output .build/selection-performance-results.xml 2>&1 | tee -a "$RUNNER_TEMP/PhotoSelect-build.log"
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('.build/selection-performance-results.xml').getroot().iter('testcase'))
          assert len(cases) == 1
          assert not any(c.find(t) is not None for c in cases for t in ('failure', 'error', 'skipped'))
          PYTEST
      - name: Upload personal-test installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J-S-${{ env.PHOTOSELECT_VERSION }}-arm64
          path: |
            dist/J-S-*/J-S-*.dmg
            dist/J-S-*/SHA256SUMS
            ${{ runner.temp }}/PhotoSelect-build.log
            .build/browser-layout.png
            .build/browser-dark.png
            .build/browser-light.png
            .build/browser-mixed*.png
            .build/browser-document.png
            .build/*results.xml
            .build/about-panel.png
            .build/arw-*.json
            .build/filesystem-*.json
            .build/selection-performance.json
            .build/icon-validation.json
            .build/finder-icon.png
          if-no-files-found: error
          retention-days: 14
      - name: Save installer and build evidence on the delivery branch
        if: always() && (github.ref_name == 'codex/macos-installer-download' || github.ref_name == 'codex/macos27-compatibility' || github.ref_name == 'codex/exfat-finder-compatibility')
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome == 'success' && steps.selection.outcome == 'success' && 'success' || 'failure' }}
        run: bash scripts/publish-installer-result.sh
