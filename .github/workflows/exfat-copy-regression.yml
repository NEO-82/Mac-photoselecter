name: exFAT mkdir sidecar probe (test only)
on:
  push:
    branches: [codex/exfat-copy-regression]
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - name: Observe mkdir, existing descriptor identity, and system xattr creation
        run: |
          set -euo pipefail
          base="$(mktemp -d "$RUNNER_TEMP/mkdir-sidecar.XXXXXX")"
          mount="$base/mount"
          mkdir "$mount"
          hdiutil create -size 512m -type SPARSE -layout GPTSPUD -fs ExFAT -volname Probe "$base/probe.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$mount" "$base/probe.sparseimage"
          trap 'hdiutil detach "$mount"' EXIT
          diskutil info "$mount" | sed -n '/File System Personality/p;/Type (Bundle)/p'
          xcrun swift - "$mount" <<'SWIFT'
          import Foundation
          import Darwin
          let root = URL(fileURLWithPath: CommandLine.arguments[1])
          let marker = Data("0081;5f5e1000;PhotoSelectProbe;".utf8)
          for name in ["plain", "reserved"] {
              let dir = root.appendingPathComponent(name)
              let sidecar = root.appendingPathComponent("._" + name)
              let fd = name == "reserved" ? open(sidecar.path, O_RDWR | O_CREAT | O_EXCL | O_NOFOLLOW, 0o600) : -1
              if name == "reserved" { precondition(fd >= 0) }
              func observe(_ event: String) {
                  var named = stat(), held = stat()
                  let present = lstat(sidecar.path, &named) == 0
                  let owned = fd >= 0 && fstat(fd, &held) == 0 && present &&
                      held.st_ino == named.st_ino && held.st_dev == named.st_dev
                  print("::notice::\(name) \(event) appleDouble=\(present) owned=\(owned) size=\(present ? named.st_size : -1)")
              }
              observe("before mkdir")
              precondition(mkdir(dir.path, 0o700) == 0)
              observe("immediately after mkdir")
              var info = stat()
              precondition(lstat(dir.path, &info) == 0)
              observe("after directory lstat")
              let directory = open(dir.path, O_RDONLY | O_DIRECTORY | O_NOFOLLOW)
              precondition(directory >= 0)
              observe("after directory open")
              let result = marker.withUnsafeBytes {
                  fsetxattr(directory, "com.apple.quarantine", $0.baseAddress, $0.count, 0, XATTR_CREATE)
              }
              let code = result == 0 ? 0 : errno
              observe("after fsetxattr quarantine result=\(result) errno=\(code)")
              close(directory)
              if fd >= 0 { close(fd) }
          }
          SWIFT
