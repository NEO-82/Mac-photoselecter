name: mkdir AppleDouble regression (test only)
on:
  push:
    branches: [codex/exfat-copy-regression]
permissions:
  contents: read
jobs:
  copy:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Patched ExFAT
            filesystem: ExFAT
            baseline: 'false'
          - name: Patched APFS
            filesystem: APFS
            baseline: 'false'
    env:
      TEST_FILESYSTEM: ${{ matrix.filesystem }}
      TEST_BASELINE: ${{ matrix.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch pinned Sony ARW fixtures
        run: |
          export PHOTOSELECT_ARW_SAMPLE_DIRECTORY="$RUNNER_TEMP/photoselect-raw-samples"
          printf 'PHOTOSELECT_ARW_SAMPLE_DIRECTORY=%s\n' "$PHOTOSELECT_ARW_SAMPLE_DIRECTORY" >> "$GITHUB_ENV"
          bash scripts/fetch-raw-test-samples.sh
      - name: Validate folder copies on a mounted filesystem
        run: |
          set -euo pipefail
          base="$(mktemp -d "$RUNNER_TEMP/folder-copy.XXXXXX")"
          mount="$base/mount"
          mkdir "$mount"
          hdiutil create -size 2g -type SPARSE -layout GPTSPUD -fs "$TEST_FILESYSTEM" -volname "FolderCopy" "$base/copy.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$mount" "$base/copy.sparseimage"
          trap 'hdiutil detach "$mount"' EXIT
          diskutil info "$mount" | sed -n '/File System Personality/p;/Type (Bundle)/p'
          export PHOTOSELECT_COPY_TEST_VOLUME="$mount"
          if [[ "$TEST_FILESYSTEM" == ExFAT ]]; then
            peer="$base/peer"
            mkdir "$peer"
            hdiutil create -size 2g -type SPARSE -layout GPTSPUD -fs ExFAT -volname "CopyPeer" "$base/peer.sparseimage"
            hdiutil attach -nobrowse -mountpoint "$peer" "$base/peer.sparseimage"
            trap 'hdiutil detach "$peer"; hdiutil detach "$mount"' EXIT
            export PHOTOSELECT_COPY_TEST_SECOND_EXFAT_VOLUME="$peer"
          fi
          set +e
          {
            xcrun swift test --jobs 2 --filter 'FileCopyTests.test(FolderMetadata|PhotosAndFolderTrees)' &&
              xcrun swift test --skip-build --parallel --num-workers 1 --filter FileCopyTests \
                --xunit-output "$RUNNER_TEMP/copy-results.xml"
          } 2>&1 | tee "$RUNNER_TEMP/copy-test.log"
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" != 0 ]]; then
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'copy-test.log').read_text(errors='replace').splitlines()
          failures = [line for line in lines if re.search(r'error:|failed|실패|충돌|NSPOSIX', line, re.I)]
          for line in (failures[-15:] or lines[-12:]):
              print('::error::' + line.replace('%', '%25'))
          PY
            exit "$result"
          fi
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          cases = list(ET.parse(Path(os.environ['RUNNER_TEMP'], 'copy-results.xml')).getroot().iter('testcase'))
          assert len(cases) == 33, len(cases)
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          print(f"::notice::{os.environ['TEST_FILESYSTEM']} copy tests: {len(cases)} passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folder-copy-${{ matrix.filesystem }}-baseline-${{ matrix.baseline }}
          path: |
            ${{ runner.temp }}/copy-results.xml
            ${{ runner.temp }}/copy-test.log
