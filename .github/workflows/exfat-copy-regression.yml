name: exFAT mkdir sidecar probe (test only)
on:
  push:
    branches: [codex/exfat-copy-regression]
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - name: Observe mkdir, existing descriptor identity, and system xattr creation
        run: |
          set -euo pipefail
          base="$(mktemp -d "$RUNNER_TEMP/mkdir-sidecar.XXXXXX")"
          mount="$base/mount"
          mkdir "$mount"
          hdiutil create -size 512m -type SPARSE -layout GPTSPUD -fs ExFAT -volname Probe "$base/probe.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$mount" "$base/probe.sparseimage"
          trap 'hdiutil detach "$mount"' EXIT
          diskutil info "$mount" | sed -n '/File System Personality/p;/Type (Bundle)/p'
          app="$base/Probe.app"
          mkdir -p "$app/Contents/MacOS"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>dev.photoselect.mkdir-probe</string>
          <key>CFBundleExecutable</key><string>Probe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSFileQuarantineEnabled</key><true/>
          </dict></plist>
          PLIST
          cat > "$base/main.swift" <<'SWIFT'
          import Foundation
          import Darwin
          let root = URL(fileURLWithPath: CommandLine.arguments[1])
          let log = URL(fileURLWithPath: CommandLine.arguments[2])
          let prototype = log.deletingLastPathComponent().appendingPathComponent("prototype")
          try FileManager.default.createDirectory(at: prototype, withIntermediateDirectories: false)
          let marker = Data("mkdir probe metadata".utf8)
          precondition(marker.withUnsafeBytes {
              setxattr(prototype.path, "dev.photoselect.probe", $0.baseAddress, $0.count, 0, XATTR_CREATE)
          } == 0)
          let source = open(prototype.path, O_RDONLY | O_DIRECTORY)
          precondition(source >= 0)
          var messages: [String] = []
          for name in ["plain", "prefilled"] {
              let dir = root.appendingPathComponent(name)
              let sidecar = root.appendingPathComponent("._" + name)
              let fd = name == "prefilled" ? open(sidecar.path, O_RDWR | O_CREAT | O_EXCL | O_NOFOLLOW, 0o600) : -1
              if name == "prefilled" {
                  precondition(fd >= 0)
                  precondition(fcopyfile(source, fd, nil, copyfile_flags_t(COPYFILE_METADATA | COPYFILE_PACK)) == 0)
                  precondition(fsync(fd) == 0)
              }
              func observe(_ phase: String) {
                  var named = stat(), held = stat()
                  let found = lstat(sidecar.path, &named) == 0
                  let owned = fd >= 0 && fstat(fd, &held) == 0 && found &&
                      held.st_ino == named.st_ino && held.st_dev == named.st_dev
                  let quarantine = getxattr(dir.path, "com.apple.quarantine", nil, 0, 0, 0)
                  let custom = getxattr(dir.path, "dev.photoselect.probe", nil, 0, 0, 0)
                  messages.append("\(log.lastPathComponent) \(name) \(phase) found=\(found) owned=\(owned) size=\(found ? named.st_size : -1) quarantine=\(quarantine) custom=\(custom)")
              }
              observe("before mkdir")
              let result = mkdir(dir.path, 0o700)
              let code = result == 0 ? 0 : errno
              observe("after mkdir result=\(result) errno=\(code)")
              if fd >= 0 { close(fd) }
          }
          try messages.joined(separator: "\n").write(to: log, atomically: true, encoding: .utf8)
          SWIFT
          xcrun swiftc "$base/main.swift" -o "$app/Contents/MacOS/Probe"
          codesign --force --sign - "$app"
          mkdir "$mount/direct" "$mount/launch-services" "$base/direct" "$base/launch-services"
          "$app/Contents/MacOS/Probe" "$mount/direct" "$base/direct/direct.log"
          open -n -W -a "$app" --args "$mount/launch-services" "$base/launch-services/launch-services.log"
          if [[ -f "$base/launch-services/launch-services.log" ]]; then
            cat "$base/launch-services/launch-services.log" >> "$base/direct/direct.log"
          else
            echo "Launch Services probe did not produce an output" >> "$base/direct/direct.log"
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do echo "::notice::$line"; done < "$base/direct/direct.log"
