name: Folder copy regression (test only)
on:
  push:
    branches: [codex/exfat-copy-regression]
permissions:
  contents: read
jobs:
  copy:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Patched ExFAT
            filesystem: ExFAT
            baseline: 'false'
          - name: Patched APFS
            filesystem: APFS
            baseline: 'false'
          - name: v0.7.6 ExFAT reproduction
            filesystem: ExFAT
            baseline: 'true'
    env:
      TEST_FILESYSTEM: ${{ matrix.filesystem }}
      TEST_BASELINE: ${{ matrix.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch pinned Sony ARW fixtures
        run: |
          export PHOTOSELECT_ARW_SAMPLE_DIRECTORY="$RUNNER_TEMP/photoselect-raw-samples"
          printf 'PHOTOSELECT_ARW_SAMPLE_DIRECTORY=%s\n' "$PHOTOSELECT_ARW_SAMPLE_DIRECTORY" >> "$GITHUB_ENV"
          bash scripts/fetch-raw-test-samples.sh
      - name: Validate folder copies on a mounted filesystem
        run: |
          set -euo pipefail
          base="$(mktemp -d "$RUNNER_TEMP/folder-copy.XXXXXX")"
          mount="$base/mount"
          mkdir "$mount"
          hdiutil create -size 2g -type SPARSE -layout GPTSPUD -fs "$TEST_FILESYSTEM" -volname "FolderCopy" "$base/copy.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$mount" "$base/copy.sparseimage"
          trap 'hdiutil detach "$mount"' EXIT
          diskutil info "$mount" | sed -n '/File System Personality/p;/Type (Bundle)/p'
          export PHOTOSELECT_COPY_TEST_VOLUME="$mount"
          if [[ "$TEST_BASELINE" == true ]]; then
            git show HEAD^2:Sources/PhotoSelect/FileCopy.swift > Sources/PhotoSelect/FileCopy.swift
            set +e
            xcrun swift test --jobs 2 --filter FileCopyTests.testFolderAppleDoubleReservedDuringChildCopy 2>&1 | tee "$RUNNER_TEMP/copy-test.log"
            result=${PIPESTATUS[0]}
            set -e
            if [[ "$result" != 0 ]] && grep -q 'open(AppleDouble, O_EXCL, 기존 보조 파일 보존)' "$RUNNER_TEMP/copy-test.log" && grep -q 'NSPOSIXErrorDomain 17' "$RUNNER_TEMP/copy-test.log"; then
              echo '::notice::v0.7.6 reproduced EEXIST at the staging folder sidecar after the injected child-write metadata event.'
              exit 0
            fi
            echo '::error::The baseline did not reproduce the expected AppleDouble EEXIST.'
            exit 1
          fi
          if [[ "$TEST_FILESYSTEM" == ExFAT ]]; then
            xcrun swift - "$mount" <<'SWIFT'
          import Darwin
          import Foundation
          let folder = URL(fileURLWithPath: CommandLine.arguments[1]).appendingPathComponent("mkdir-probe-" + UUID().uuidString)
          let sidecar = folder.deletingLastPathComponent().appendingPathComponent("._" + folder.lastPathComponent)
          func observe(_ label: String) {
              var info = stat()
              let result = lstat(sidecar.path, &info)
              let state = result == 0 ? "present" : "absent (errno \(errno))"
              print("::notice::ExFAT directory probe \(label): sidecar \(state)")
          }
          observe("before mkdir")
          precondition(mkdir(folder.path, 0o700) == 0)
          observe("after mkdir")
          try Data("child".utf8).write(to: folder.appendingPathComponent("child.ARW"))
          observe("after child write")
          let marker = Data("controlled directory attribute".utf8)
          precondition(marker.withUnsafeBytes {
              setxattr(folder.path, "dev.photoselect.probe", $0.baseAddress, $0.count, 0, 0)
          } == 0)
          observe("after setxattr on directory")
          SWIFT
          fi
          set +e
          {
            xcrun swift test --jobs 2 --filter 'FileCopyTests.test(EmptyPhotoAndNestedFolders|FolderAppleDouble)' &&
              xcrun swift test --skip-build --parallel --num-workers 1 --filter FileCopyTests \
                --xunit-output "$RUNNER_TEMP/copy-results.xml"
          } 2>&1 | tee "$RUNNER_TEMP/copy-test.log"
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" != 0 ]]; then
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'copy-test.log').read_text(errors='replace').splitlines()
          failures = [line for line in lines if re.search(r'error:|failed|실패|충돌|NSPOSIX', line, re.I)]
          for line in (failures[-15:] or lines[-12:]):
              print('::error::' + line.replace('%', '%25'))
          PY
            exit "$result"
          fi
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          cases = list(ET.parse(Path(os.environ['RUNNER_TEMP'], 'copy-results.xml')).getroot().iter('testcase'))
          assert len(cases) == 31, len(cases)
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          print(f"::notice::{os.environ['TEST_FILESYSTEM']} copy tests: {len(cases)} passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folder-copy-${{ matrix.filesystem }}-baseline-${{ matrix.baseline }}
          path: |
            ${{ runner.temp }}/copy-results.xml
            ${{ runner.temp }}/copy-test.log
